<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ff7eb6" />
  <meta name="description" content="Las aventuras de Pelu, la gatita blanca: explora, decora, cocina, corre y aprende jugando." />
  <title>Pelu Adventures 🐱</title>

  <!-- PWA / instalación en iPad y celular -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Pelu" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <div id="confeti"></div>
  <div id="juego-phaser"></div>

  <!-- Motor de juego (local, sin internet) -->
  <script src="js/lib/phaser.min.js"></script>
  <!-- El orden importa: data → sprite → game → aventuras → plataformas -->
  <script src="js/data.js"></script>
  <script src="js/pelu-sprite.js"></script>
  <!-- Arte dibujado (SVG): gatitas, accesorios, edificios, muebles, mascotas… -->
  <script src="js/arte.js"></script>
  <script src="js/arte-extra.js"></script>
  <script src="js/game.js"></script>
  <!-- Contenido de retos (inglés y lógica) + generador por niveles -->
  <script src="js/ingles-vocab1.js"></script>
  <script src="js/ingles-vocab2.js"></script>
  <script src="js/ingles-frases.js"></script>
  <script src="js/logica-contenido.js"></script>
  <script src="js/retos.js"></script>
  <script src="js/aventuras.js"></script>
  <script src="js/platformer.js"></script>
  <script src="js/race.js"></script>
  <script src="js/cooking.js"></script>
  <script src="js/fishing.js"></script>
  <script src="js/swim.js"></script>
  <script src="js/escape.js"></script>
  <script src="js/historia.js"></script>
  <script src="js/mundo.js"></script>
  <!-- Pueblo (inicio), misiones, álbum, casa de muñecas y vestidor -->
  <script src="js/pueblo.js"></script>
  <script src="js/casa.js"></script>

  <!-- Registrar el service worker para jugar sin internet (solo si hay soporte) -->
  <script>
    // En desarrollo (localhost) no se usa el service worker: así cada cambio se ve al recargar.
    const enDesarrollo = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    if (enDesarrollo && "serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
      if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
    }
    if ("serviceWorker" in navigator && location.protocol.startsWith("http") && !enDesarrollo) {
      // Si llega una versión nueva mientras está abierto, recargar una vez para usarla
      // (antes la versión nueva recién se veía en la apertura siguiente).
      const habiaVersion = !!navigator.serviceWorker.controller;
      let recargando = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!habiaVersion || recargando) return;
        recargando = true;
        location.reload();
      });
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
